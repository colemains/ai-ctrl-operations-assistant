global:
  environment: local
  domain: localhost

images:
  web:
    repository: ai-ctrl-assistant-web
    tag: latest
    pullPolicy: Never

  mastra:
    repository: ai-ctrl-assistant-mastra
    tag: latest
    pullPolicy: Never

replicaCount:
  web: 1
  mastra: 1

autoscaling:
  enabled: false

service:
  type: ClusterIP
  web:
    port: 3000
    targetPort: 3000
  mastra:
    port: 8080
    targetPort: 8080

env:
  NODE_ENV: development
  USE_MOCK_DATA: "true"
  AUTH_ENABLED: "false"
  NEXT_PUBLIC_API_URL: "http://ai-ctrl-assistant-mastra:8080"

  SMC_API_ENABLED: "false"
  ELASTIC_API_ENABLED: "false"
  OPENWEBUI_API_ENABLED: "false"
  CONFLUENCE_API_ENABLED: "false"
  ALERTS_API_ENABLED: "false"
  NOTIFICATIONS_ENABLED: "false"

  OTEL_ENABLED: "false"
  AUDIT_LOGGING_ENABLED: "true"
  COST_TRACKING_ENABLED: "true"
  DAILY_BUDGET_USD: "5.00"
  MONTHLY_BUDGET_USD: "50.00"

ingress:
  enabled: false

# DISABLE Helm subchart dependencies
postgresql:
  enabled: false

redis:
  enabled: false

# Provide database connection strings for our standalone manifests
secrets:
  databaseUrl: "postgresql://aictrl:aictrl123@postgres:5432/aictrl_ops"
  redisUrl: "redis://redis:6379"
  qdrantUrl: ""
  qdrantApiKey: ""
  workosApiKey: ""
  workosClientId: ""
  anthropicApiKey: ""
  openaiApiKey: ""
  sessionSecret: "local-dev-secret-12345"

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  web:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  mastra:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

securityContext:
  runAsNonRoot: false
  runAsUser: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 1001
  fsGroup: 1001

networkPolicy:
  enabled: false