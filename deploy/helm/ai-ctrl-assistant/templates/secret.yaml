{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-ctrl-assistant.fullname" . }}-secret
  labels:
    {{- include "ai-ctrl-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default (printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "ai-ctrl-assistant.fullname" .) .Values.postgresql.auth.database) | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | default (printf "redis://:%s@%s-redis-master:6379" .Values.redis.auth.password (include "ai-ctrl-assistant.fullname" .)) | quote }}
  QDRANT_URL: {{ .Values.secrets.qdrantUrl | default (printf "http://%s-qdrant:6333" (include "ai-ctrl-assistant.fullname" .)) | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  WORKOS_API_KEY: {{ .Values.secrets.workosApiKey | quote }}
  WORKOS_CLIENT_ID: {{ .Values.secrets.workosClientId | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SMC_API_TOKEN: {{ .Values.secrets.smcApiToken | quote }}
  ELASTIC_API_KEY: {{ .Values.secrets.elasticApiKey | quote }}
  OPENWEBUI_API_TOKEN: {{ .Values.secrets.openwebuiApiToken | quote }}
  CONFLUENCE_API_TOKEN: {{ .Values.secrets.confluenceApiToken | quote }}
  ALERTS_API_TOKEN: {{ .Values.secrets.alertsApiToken | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | default (randAlphaNum 32) | quote }}
{{- end }}