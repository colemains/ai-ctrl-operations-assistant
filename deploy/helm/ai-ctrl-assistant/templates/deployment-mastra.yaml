apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-ctrl-assistant.fullname" . }}-mastra
  labels:
    {{- include "ai-ctrl-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mastra
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.mastra }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-ctrl-assistant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mastra
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "ai-ctrl-assistant.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mastra
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mastra
        image: "{{ .Values.images.mastra.repository }}:{{ .Values.images.mastra.tag }}"
        imagePullPolicy: {{ .Values.images.mastra.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: NODE_ENV
          value: {{ .Values.env.NODE_ENV | quote }}
        - name: USE_MOCK_DATA
          value: {{ .Values.env.USE_MOCK_DATA | quote }}
        - name: AUTH_ENABLED
          value: {{ .Values.env.AUTH_ENABLED | quote }}

        # Database connection
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "ai-ctrl-assistant.fullname" . }}-secret
              key: databaseUrl

        # Redis connection
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "ai-ctrl-assistant.fullname" . }}-secret
              key: redisUrl

        # API Integration toggles
        - name: SMC_API_ENABLED
          value: {{ .Values.env.SMC_API_ENABLED | quote }}
        - name: ELASTIC_API_ENABLED
          value: {{ .Values.env.ELASTIC_API_ENABLED | quote }}
        - name: OPENWEBUI_API_ENABLED
          value: {{ .Values.env.OPENWEBUI_API_ENABLED | quote }}
        - name: CONFLUENCE_API_ENABLED
          value: {{ .Values.env.CONFLUENCE_API_ENABLED | quote }}
        - name: ALERTS_API_ENABLED
          value: {{ .Values.env.ALERTS_API_ENABLED | quote }}

        # API Tokens (from external secret)
        {{- if .Values.env.SMC_API_ENABLED }}
        - name: SMC_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: SMC_API_TOKEN
              optional: true
        {{- end }}

        {{- if .Values.env.ELASTIC_API_ENABLED }}
        - name: ELASTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: ELASTIC_API_KEY
              optional: true
        {{- end }}

        {{- if .Values.env.OPENWEBUI_API_ENABLED }}
        - name: OPENWEBUI_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: OPENWEBUI_API_TOKEN
              optional: true
        {{- end }}

        {{- if .Values.env.CONFLUENCE_API_ENABLED }}
        - name: CONFLUENCE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: CONFLUENCE_API_TOKEN
              optional: true
        {{- end }}

        {{- if .Values.env.ALERTS_API_ENABLED }}
        - name: ALERTS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: ALERTS_API_TOKEN
              optional: true
        {{- end }}

        # AI Provider Keys
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: ANTHROPIC_API_KEY
              optional: true

        # WorkOS Auth
        {{- if eq .Values.env.AUTH_ENABLED "true" }}
        - name: WORKOS_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: WORKOS_API_KEY
              optional: true
        - name: WORKOS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ai-ctrl-api-tokens
              key: WORKOS_CLIENT_ID
              optional: true
        {{- end }}

        # Observability
        - name: OTEL_ENABLED
          value: {{ .Values.env.OTEL_ENABLED | quote }}
        - name: AUDIT_LOGGING_ENABLED
          value: {{ .Values.env.AUDIT_LOGGING_ENABLED | quote }}
        - name: COST_TRACKING_ENABLED
          value: {{ .Values.env.COST_TRACKING_ENABLED | quote }}
        - name: NOTIFICATIONS_ENABLED
          value: {{ .Values.env.NOTIFICATIONS_ENABLED | quote }}

        # Budget limits
        - name: DAILY_BUDGET_USD
          value: {{ .Values.env.DAILY_BUDGET_USD | quote }}
        - name: MONTHLY_BUDGET_USD
          value: {{ .Values.env.MONTHLY_BUDGET_USD | quote }}

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        resources:
          {{- toYaml .Values.resources.mastra | nindent 10 }}

        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
