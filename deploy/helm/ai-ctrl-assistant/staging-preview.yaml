    app.kubernetes.io/instance: ai-ctrl-assistant
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "ai-assistant-staging.expedient.cloud"
      secretName: ai-assistant-staging-tls
  rules:
    - host: "ai-assistant-staging.expedient.cloud"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-ctrl-assistant-web
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-ctrl-assistant-mastra
                port:
                  number: 8080
