version: '3.8'

services:
  # PostgreSQL - For audit logs, user profiles, query history
  postgres:
    image: postgres:15-alpine
    container_name: ai-ctrl-postgres
    environment:
      POSTGRES_USER: ai_ctrl
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: ai_ctrl_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ctrl"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - For caching and session management
  redis:
    image: redis:7-alpine
    container_name: ai-ctrl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector database for RAG/semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-ctrl-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: ai-ctrl-network