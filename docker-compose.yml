version: '3.8'

services:
  # PostgreSQL - For audit logs, user profiles, query history
  postgres:
    image: postgres:15-alpine
    container_name: ai-ctrl-postgres
    environment:
      POSTGRES_USER: ai_ctrl
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: ai_ctrl_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ctrl"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - For caching and session management
  redis:
    image: redis:7-alpine
    container_name: ai-ctrl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/mastra/Dockerfile
    container_name: ai-ctrl-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - USE_MOCK_DATA=true
      - AUTH_ENABLED=false
      - ALLOWED_ORIGINS=*
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RETOOL_API_URL=${RETOOL_API_URL:-https://api.retool.com/v1}
      - RETOOL_API_KEY=${RETOOL_API_KEY}
      - RETOOL_ENVIRONMENT=${RETOOL_ENVIRONMENT:-production}
    networks:
      - ai-ctrl-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web UI
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-ctrl-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - ai-ctrl-network

networks:
  ai-ctrl-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: