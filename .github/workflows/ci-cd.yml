name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build --workspace=@ai-ctrl/contracts
          npm run build --workspace=@ai-ctrl/authz
          npm run build --workspace=@ai-ctrl/telemetry
          npm run build --workspace=@ai-ctrl/tool-sdk
          npm run build --workspace=@ai-ctrl/tool-smc
          npm run build --workspace=@ai-ctrl/tool-alerts
          npm run build --workspace=@ai-ctrl/retool-workflows
          npm run build --workspace=@ai-ctrl/note-generator

      - name: Build backend
        run: npm run build --workspace=@ai-ctrl/mastra

      - name: Build frontend
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/mastra/Dockerfile
          push: false
          tags: ai-ctrl-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: ai-ctrl-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
